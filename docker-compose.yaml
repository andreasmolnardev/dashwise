services:
  dashwise:
    image: andreasmolnardev/dashwise:aio-preview
    ports:
      - "3016:3000"
      - "8090:8090"
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PB_ADMIN_EMAIL: default@dashwise.local
      PB_ADMIN_PASSWORD: DashwiseIsAwesome
      PB_URL: http://127.0.0.1:8090
      NEXT_PUBLIC_PB_URL: http://127.0.0.1:8090
      START_POCKETBASE: "true"
      PB_BINARY_PATH: /usr/local/bin/pocketbase
    volumes:
      - ./pocketbase/pb_data:/app/pocketbase/pb_data
      - ./pocketbase/migrations:/app/pocketbase/migrations
