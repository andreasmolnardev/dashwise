services:
  dashwise:
    image: andreasmolnardev/dashwise:go-migration
    ports:
      - "3016:3000"
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATA_DIR: /data
      DATABASE_PATH: /data/dashwise.sqlite
      WEB_DIST: /app/public
    volumes:
      - ./dashwise-data:/data
