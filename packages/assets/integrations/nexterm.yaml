# Dashwise Integration YAML
details:
  name: Nexterm
  description: "Open source server management software for SSH, VNC & RDP"
  author: ""
  version: 1.0.0
  repository: "https://github.com/gnmyt/Nexterm"
  icon: "/icons/png/nexterm-light.png"
  links:
    website: "https://nexterm.dev"
    documentation: "https://docs.nexterm.dev"
    support: "https://dc.gnmyt.dev"
  categories:
    - Remote Access
    - Monitoring

configuration:
  environment_variables:
    TOKEN:
      required: false
      user_hidden: true
    URL:
      required: true
      description: "Base URL of your Nexterm instance (e.g. https://nexterm.example.com)"
    NT_USER:
      required: true
      edit: "overwrite-only"
      description: "Nexterm username"
    NT_PASS:
      required: true
      edit: "overwrite-only"
      description: "Nexterm password"
    SHOW_RECENT_COUNT:
      required: false
      default: 5
      description: "Number of recent connections to display in the widget"

  endpoints:
    retrieve-token:
      method: POST
      url: "${URL}/api/auth/login"
      body:
        username: "${NT_USER}"
        password: "${NT_PASS}"
      response:
        type: json
        data_path: "token"
        data_set_env: "TOKEN"
        invalidate:
          after: 86400 # 1 day

    server-connections:
      method: GET
      url: "${URL}/api/entries/recent"
      auth: "Bearer ${TOKEN}"
      insecure_skip_verify: true
      response:
        type: json
      discard_unmapped: true
      response_mapping:
        entries:
          iterate: "response"
          mappingProperties:
            id: "entryId"
            name: "name"
            type: "type"

    fetch-monitoring:
      method: GET
      url: "${URL}/api/monitoring"
      auth: "Bearer ${TOKEN}"
      insecure_skip_verify: true
      response:
        type: json
      discard_unmapped: true
      response_mapping:
        servers:
          iterate: "items"
          mappingProperties:
            id: "id"
            name: "name"
            status: "status"        # online | offline | unknown
            cpu_percent: "cpu"
            memory_percent: "memory"
            disk_percent: "disk"
            uptime_seconds: "uptime"
            last_seen: "lastSeen"

  computed:
    servers:
      operation: expand
      on: this.endpoints.fetch-monitoring.mappedResponse.servers as server
      fields:
        health:
          initial_value: 100
          iterate_over: lookup_tables.server_metrics as metric
          operation: if
          condition: server[metric.property] >= metric.threshold_warn
          and: server.status == "online"
          then:
            operation: math
            subtract: metric.multiplier * (server[metric.property] - metric.threshold_warn)
            from: server.health
          else:
            condition: server.status != "online"
            then: 0
        warnings:
          iterate_over: lookup_tables.server_metrics as metric
          operation: if
          condition: server[metric.property] >= metric.threshold_warn
          then: "${metric.name} usage high"

  lookup_tables:
    server_metrics:
      - name: CPU
        multiplier: 2.5
        property: "cpu_percent"
        threshold_warn: 70
        threshold_critical: 90
      - name: Memory
        multiplier: 1.5
        property: "memory_percent"
        threshold_warn: 80
        threshold_critical: 95
      - name: Disk
        multiplier: 4
        property: "disk_percent"
        threshold_warn: 75
        threshold_critical: 90

    connection_type_icons:
      ssh: "faTerminal"
      rdp: "faDesktop"
      vnc: "faTv"

    status_colors:
      online: "#16a34a"
      offline: "#ef4444"
      unknown: "#6b7280"

  shortcuts:
    - main:
        iterate_over: "this.endpoints.server-connections.mappedResponse.entries"
        mappingProperties:
          id: "${id}"
          name: "${name}"
          icon: "url:/icons/png/nexterm-light.png"
          secondaryInfo: "${type}"
          type: "nextermEntry"
          action: "url:${URL}/servers?connectId=${id}"
          tags:
            - "Nexterm"
            - "Servers"
            - "Remote Access"
            - "${type|upper}"
            - "${name}"