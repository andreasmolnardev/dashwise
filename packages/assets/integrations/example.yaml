# Dashwise Integration YAML Syntax Reference
# This file documents the structure and options available for integration configuration files.

# ---------------------------------------------------------
# 1. Details Section
# Basic metadata about the integration.
# ---------------------------------------------------------
# Template strings support `${VAR}` interpolation and `primary ??? fallback` semantics.
# When the interpolated value looks like JSON (`{...}` or `[...]`), it is parsed automatically.
# Environment lookup is case-insensitive and will fall back from exact name to upper/lower variants.
#
# Example:
#   title: "${name} ??? Untitled"
#   icon: "${icon} ??? /icons/png/default.png"
#   action: "url:${URL}/item/${id}"
#
# Fallbacks are only used when the primary expression resolves to empty or still contains an unresolved `${...}` token.
details:
  name: "Example Integration"       # Display name of the integration
  description: "A short summary"    # (Optional) Description
  author: "Author Name"             # (Optional)
  version: "1.0.0"                  # Version string
  repository: "https://github..."   # (Optional)
  source: "https://..."
  icon: "/icons/png/example.png"    # Path to the icon image
  links:                            # (Optional) External links
    website: ""
    documentation: ""
    support: ""
  categories:                       # List of categories for discovery
    - Monitoring

# ---------------------------------------------------------
# 2. Configuration Section
# Defines how the integration connects to the external service.
# ---------------------------------------------------------
configuration:
  # Environment Variables
  # Used for secrets, URLs, and user settings.
  environment_variables:
    URL:
      required: true
      description: "Base URL of the service"
    API_KEY:
      required: true
      user_hidden: true             # Sensitive value, obscured in UI
      edit: "overwrite-only"         # Prevent reading back existing value
    POLLING_INTERVAL:
      required: false
      default: 60                   # Default value if not provided
      description: "Interval in seconds"
    SHOW_HEADER:
      required: false
      default: true
      description: "Toggle the header on the column widget examples"
    SHOW_CPU:
      required: false
      default: true
      description: "Toggle the CPU column in the static array example"
    SHOW_MEMORY:
      required: false
      default: true
      description: "Toggle the Memory column in the static array example"
    SHOW_STORAGE:
      required: false
      default: true
      description: "Toggle the Storage column in the static array example"
    SHOW_LIST_HEADER:
      required: false
      default: true
      description: "Toggle the list widget header"
    SHOW_CARD_HEADER:
      required: false
      default: true
      description: "Toggle the details card header"
    SHOW_IFRAME_HEADER:
      required: false
      default: true
      description: "Toggle the iframe widget header"

  # Endpoints
  # HTTP requests used to fetch or push data.
  endpoints:
    auth-step:
      method: POST
      url: "${URL}/api/auth"        # Variables use ${VAR_NAME} syntax
      body:
        username: "admin"
        password: "${PASSWORD}"
      response:
        type: json
        data_path: "token"          # Path in JSON response to extract
        data_set_env: "AUTH_TOKEN"  # Store result in a temporary env var

    fetch-data:
      method: GET
      url: "${URL}/api/data"
      auth: "Bearer ${AUTH_TOKEN}"  # Uses token from previous step
      insecure_skip_verify: true    # (Optional) Skip SSL verification
      custom_headers:
        X-Custom: "value"
      response:
        type: json
        data_path: "items"
      # Mapping transforms raw response into a structured format
      response_mapping:
        items_list:
          iterate: "items"          # Loop through array at data_path
          mappingProperties:
            id: "id"
            name: "display_name"
            stats:
              cpu: "usage.cpu"
              memory: "usage.mem"

    camera:
      method: GET
      url: "${URL}/camera"
      response:
        type: json
        invalidate:
          every: "1 hour"

  # Computed Fields
  # Process and aggregate data from endpoints.
  computed:
    status_summary:
      iterate_over: "this.endpoints.fetch-data.mappedResponse.items_list"
      filter: "stats.cpu > 80"       # (Optional) Boolean expression to filter items
      key: "${name}"                # Unique key for the resulting object
      fields:
        label: "${name}"
        score:
          operation: "compute_health" # Built-in operations (e.g., compute_health_score, compute_severity)
          inputs:
            value: "stats.cpu"
            threshold: 90
        link: "${URL}/dashboard/${id}"

  # Widgets
  # Defines how data is presented on the dashboard.
  # This section shows every supported widget template and the optional fields
  # that the current resolver understands.
  widgets:
    - name: "Columns Widget (prototype)"
      key: "columns-prototype"
      template: "columns"
      depends_on:
        - "computed.status_summary"
      refresh_interval: 30
      data:
        source: "computed.status_summary"
        input:
          URL: "${URL}"
          API_KEY: "${API_KEY}"
          POLLING_INTERVAL: "${POLLING_INTERVAL}"
          display_customizations:
            order:
              - "status-overview"
              - "uptime"
            hidden:
              - "deprecated"
      properties:
        header:
          show_if: "${SHOW_HEADER} != false"
          title: "System Status"
          icon: "integrations.example.details.icon"
          titleAction: "url:${URL}/status"
        columns:
          user_customizations:
            - allow_reorder
            - allow_hide
          iterate_over: "computed.status_summary"
          prototype:
            id: "${id}"
            label: "${label}"
            primary: "${score}%"
            primaryAction: "url:${link}"
            secondary: "${description}"
            title: "${name}"
            titleAction: "url:${link}"
            thumbnail: "${thumbnail}"
            icon:
              type: "weather"
              file: "${icon_file} ??? fa6-solid:circle-info"
              size: 32
              description: "${icon_description}"
              useFrostedGradient: true
            progress:
              type: "circular"
              value: "${score}"
              thresholds:
                - min: 80
                  color: "#16a34a"
                - min: 60
                  color: "#f59e0b"
                - min: 0
                  color: "#ef4444"
              zero_label: "N/A"
            badge:
              show: true
              icon: "fa6-solid:triangle-exclamation"
              tooltip: "${warning}"

    - name: "Columns Widget (static array)"
      key: "columns-static"
      template: "columns"
      properties:
        header:
          show_if: "${SHOW_HEADER}"
          title: "Static Columns"
          icon: "integrations.example.details.icon"
          titleAction: "url:${URL}/static"
        columns:
          - show_if: "${SHOW_CPU} != false"
            id: "cpu"
            label: "CPU"
            primary: "${computed.metrics.cpu.avg_load}%"
            primaryAction: "url:${URL}/cpu"
            secondary: "${computed.metrics.cpu.cores} cores"
          - show_if: "${SHOW_MEMORY} != false"
            id: "memory"
            label: "Memory"
            icon:
              type: "custom"
              file: "fa6-solid:memory"
              size: 28
              description: "Memory usage"
              useFrostedGradient: false
            primary: "${computed.metrics.memory.used_percent}%"
            secondary: "${computed.metrics.memory.total} total"
            badge:
              show: true
              icon: "fa6-solid:circle-info"
              tooltip: "Usage details"
          - show_if: "${SHOW_STORAGE} != false"
            id: "storage"
            label: "Storage"
            title: "Disks"
            titleAction: "url:${URL}/storage"
            thumbnail: "${computed.metrics.storage.thumbnail}"
            primary: "${computed.metrics.storage.used_percent}%"
            secondary: "${computed.metrics.storage.total} used"

    - name: "Vertical List Widget"
      key: "vertical-list-reference"
      template: "vertical-list"
      depends_on:
        - "computed.items"
      hide_if_empty: true
      refresh_interval: 60
      data:
        source: "computed.items"
        input:
          URL: "${URL}"
          API_KEY: "${API_KEY}"
      properties:
        header:
          show_if: "${SHOW_LIST_HEADER} != false"
          title: "Recent Items"
          icon: "fa6-solid:list"
          titleAction: "url:${URL}/items"
        list:
          iterate_over: "computed.items"
          max_items: 8
          # max_visible is also supported and behaves the same as max_items.
          max_visible: 8
          sort_by: "updated_at"
          sort_order: "desc"
          prototype:
            accent:
              value: "severity"
              map:
                critical: "#ef4444"
                warning: "#f59e0b"
                info: "#3b82f6"
            icon:
              value: "kind"
              map:
                doc: "fa6-solid:file-lines"
                link: "fa6-solid:link"
                image: "fa6-solid:image"
            title: "${title}"
            titleAction: "url:${link}"
            subtitle:
              type: "list"
              value: "${tags}"
            thumbnail: "${thumbnail}"
            badge:
              show: true
              icon: "fa6-solid:bell"
              tooltip: "${summary}"

    - name: "Item Details Card"
      key: "icon-details-card-reference"
      template: "icon-details-card"
      depends_on:
        - "computed.item"
      data:
        source: "computed.item"
        input:
          URL: "${URL}"
      properties:
        header:
          show_if: "${SHOW_CARD_HEADER} != false"
          title: "Current Item"
          icon: "fa6-solid:circle-info"
          titleAction: "url:${URL}/item"
        icon:
          file: "${computed.item.icon} ??? fa6-solid:square"
        primary: "${computed.item.name}"
        secondary: "${computed.item.description}"

    - name: "Iframe Widget"
      key: "iframe-reference"
      template: "iframe"
      data:
        source: "computed.iframe"
        input:
          URL: "${URL}"
      properties:
        header:
          show_if: "${SHOW_IFRAME_HEADER} != false"
          title: "Embedded App"
          icon: "fa6-solid:window-restore"
          titleAction: "url:${URL}"
        url: "${URL}/embed"
        min_height: 300
        max_height: 800

    - name: "Open Tasks"
      key: "open-tasks"
      template: "vertical-list"
      depends_on:
        - "computed.status_summary"
      data:
        source: "computed.status_summary"
      properties:
        header:
          title: "Open Tasks"
          icon: "fa6-solid:list-check"
        list:
          user_customizations:
            - allow_reorder
          iterate_over: "computed.status_summary"
          max_items: 5
          prototype:
            group: "System"
            title: "${label}"
            titleAction: "url:${link}"
            subtitle:
              - "${stats.cpu}% CPU"
              - "${stats.memory} RAM"
            icon: "fa6-solid:circle-check"
            badge:
              show: true
              icon: "fa6-solid:triangle-exclamation"
              tooltip: "High load"

    - name: "Service Card"
      key: "service-card"
      template: "icon-details-card"
      depends_on:
        - "computed.status_summary"
      data:
        source: "computed.status_summary"
      properties:
        header:
          title: "Service Card"
          icon: "integrations.example.details.icon"
        icon:
          file: "integrations.example.details.icon"
        primary: "${label}"
        secondary: "${stats.cpu} CPU / ${stats.memory} RAM"

    - name: "Embed Panel"
      key: "embed-panel"
      template: "iframe"
      depends_on:
        - "computed.status_summary"
      properties:
        header:
          title: "Embed Panel"
          icon: "fa6-solid:window-restore"
        url: "${URL}/dashboard"
        min_height: 240
        max_height: 720

    - name: "Remote Image"
      key: "remote-image"
      template: "image"
      properties:
        header:
          title: "Camera"
          icon: "fa6-solid:image"
        endpoint: camera
        image_url_property: "img.url"
        title_url: "${CAMERA_URL}"
        alt: "Camera image"
        min_height: 180
        max_height: 600

  # Image endpoints can cache their JSON response. `after` is a duration from
  # fetch time; `every` uses the next aligned hour/day/week/month boundary.
  # Examples: "6 hours", "2 days", "every 2 hours", "every week".

# ---------------------------------------------------------
# 3. Shortcuts
# Defines how the integration contributes to global search.
# ---------------------------------------------------------
shortcuts:
  - main:
      iterate_over: "this.endpoints.fetch-data.mappedResponse.items_list"
      mappingProperties:
        id: "${id}"
        name: "${name}"
        icon: "integrations.example.details.icon"
        secondaryInfo: "Example Service"
        type: "exampleItem"
        action: "url:${URL}/item/${id}"
        tags:
          - "Example"
          - "${name}"

# ---------------------------------------------------------
# 4. Glanceables
# Defines compact summary items shown in glanceable slots.
# See weather.yaml for a richer example with computed fields and icon rendering.
# ---------------------------------------------------------
glanceables:
  - name: "Example Glanceable"
    key: "example-glanceable"
    properties:
      label: "${name}"
      value: "${value}"
    icon:
      file: "${icon} ??? fa6-solid:sun"
      size: 16
      description: "${description}"
    text: "${value} ??? No data"
