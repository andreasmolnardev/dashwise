# Dashwise Integration YAML
details:
  name: Beszel
  description: ""
  author: ""
  version: 1.0.0
  repository: ""
  icon: "/icons/png/beszel-light.png"
  links:
    website: ""
    documentation: ""
    support: ""
  categories:
    - Monitoring

configuration:
  environment_variables:
    TOKEN:
      required: false
      user_hidden: true
    URL:
      required: true
    PB_USER:
      required: true
      edit: "overwrite-only"
    PB_PASS:
      required: true
      edit: "overwrite-only"
    THRESHOLD_CPU_WARN:
      required: false
      default: 70
      description: "CPU usage % that triggers a warning"
    THRESHOLD_CPU_CRITICAL:
      required: false
      default: 90
      description: "CPU usage % that triggers a critical warning"
    THRESHOLD_MEM_WARN:
      required: false
      default: 70
      description: "Memory usage % that triggers a warning"
    THRESHOLD_MEM_CRITICAL:
      required: false
      default: 90
      description: "Memory usage % that triggers a critical warning"
    THRESHOLD_DISK_WARN:
      required: false
      default: 70
      description: "Disk usage % that triggers a warning"
    THRESHOLD_DISK_CRITICAL:
      required: false
      default: 90
      description: "Disk usage % that triggers a critical warning"
    THRESHOLD_LOAD_WARN:
      required: false
      default: 1.0
      description: "Long-term (480min) load multiplier vs CPU cores that triggers a warning (e.g. 1.0 = 1x core count)"

  endpoints:
    retrieve-token:
      method: POST
      url: "${URL}/api/collections/_superusers/auth-with-password"
      body:
        identity: "${PB_USER}"
        password: "${PB_PASS}"
      response:
        type: json
        data_path: "token"
        data_set_env: "TOKEN"
        invalidate:
          after: 86400 # a day 

    fetch-systems:
      method: GET
      url: "${URL}/api/collections/systems/records"
      auth: "Bearer ${TOKEN}"
      custom_headers: {}
      insecure_skip_verify: true
      response:
        type: json
        data_path: "items"
      discard_unmapped: true
      response_mapping:
        systems:
          iterate: "items"
          mappingProperties:
            id: "id"
            name: "name"
            info:
              - status: "status"
              - cpu:
                  model: "m"
                  cores: "c"
              - os:
                  kernel: "k"
                  boot_time_seconds: "bb"
              - memory:
                  total_mb: "mb"
              - disk:
                  total_gb: "dt"
              - temperature_c: "t"
              - hostname: "h"
              - uptime_seconds: "u"
              - beszel_version: "v"
            usage:
              - cpu_usage_percent: "cpu"
              - memory_usage_percent: "mp"
              - disk_usage_percent: "dp"
            load:
              "1m": "l1"
              "5m": "l5"
              "15m": "l15"
            network:
              bytes_sent: "b"
              bytes_received: "bb"
              interfaces: "efs"

    fetch-system-stats:
      method: GET
      url: "${URL}/api/collections/system_stats/records"
      auth: "Bearer ${TOKEN}"
      insecure_skip_verify: true
      iterate_over: "this.endpoints.fetch-systems.mappedResponse.systems"
      iterate_key: "id"
      group_by: "system"
      response:
        type: json
        data_path: "items"
      response_mapping:
        per_system:
          aggregate_over: "items"
          average_total_memory_mb:
            operation: avg
            field: "stats.m"
            transform: "round(value * 1024)"
          load:
            "1m":
              operation: nth_from_end
              field: "stats.la[0]"
              offset: 0
            "10min":
              operation: nth_from_end
              field: "stats.la[0]"
              offset: 10
            "20min":
              operation: nth_from_end
              field: "stats.la[0]"
              offset: 20
            "120min":
              operation: nth_from_end
              field: "stats.la[0]"
              offset: 120
            "480min":
              operation: nth_from_end
              field: "stats.la[0]"
              offset: 480

  computed:
    systems:
      operation: expand
      on: this.endpoints.fetch-systems.mappedResponse.systems as system
      fields:
        health:
          initial_value: 100
          iterate_over: lookup_tables.system_properties as prop
          operation: if
          condition: system[prop.property] >= prop.threshold_warn # return false when prop is not available for this system
          then: system.health - (prop.multiplier * system[prop.property])
        warnings:
          iterate_over: lookup_tables.system_properties as prop
          operation: if
          condition: system[prop.property] >= prop.threshold_warn # return empty string when prop is not available for this system
          then: "${prop.name} usage high"

  lookup_tables:
    system_properties:
      - cpu: 
        multiplier: 2.5
        property: "usage.cpu_usage_percent"
        threshold_warn: "${THRESHOLD_CPU_WARN}"
        threshold_critical: "${THRESHOLD_CPU_CRITICAL}"
      - memory: 
        multiplier: 1
        property: "usage.memory_usage_percent"
        threshold_warn: "${THRESHOLD_MEM_WARN}"
        threshold_critical: "${THRESHOLD_MEM_CRITICAL}"
      - disk: 
        multiplier: 4
        property: "usage.disk_usage_percent"
        threshold_warn: "${THRESHOLD_DISK_WARN}"
        threshold_critical: "${THRESHOLD_DISK_CRITICAL}"
      - gpu: 
        multiplier: 2

      - load_cpu:
        multiplier: 2.5
  
  widgets:
    - name: "Beszel System Health"
      key: "beszel-system-health"
      template: "columns"
      depends_on:
        - "computed.systems"
      data:
        source: "computed.systems"
        input:
          URL: "${URL}"
          TOKEN: "${TOKEN}"
          PB_USER: "${PB_USER}"
          PB_PASS: "${PB_PASS}"
          THRESHOLD_CPU_WARN: "${THRESHOLD_CPU_WARN}"
          THRESHOLD_CPU_CRITICAL: "${THRESHOLD_CPU_CRITICAL}"
          THRESHOLD_MEM_WARN: "${THRESHOLD_MEM_WARN}"
          THRESHOLD_MEM_CRITICAL: "${THRESHOLD_MEM_CRITICAL}"
          THRESHOLD_DISK_WARN: "${THRESHOLD_DISK_WARN}"
          THRESHOLD_DISK_CRITICAL: "${THRESHOLD_DISK_CRITICAL}"
      properties:
        header:
          title: "Beszel System Health"
          icon: "url:/icons/png/beszel-light.png"
          titleAction: "url:${URL}"
        columns:
          iterate_over: "computed.systems"
          prototype:
            primary: "${system.name}"
            secondary: "${biggest_minus} ??? Healthy"
            progress:
              type: "circular"
              value: "if(details.status contains 'down', 0, health_score)"
              thresholds:
                - min: 80
                  color: "#16a34a"
                - min: 60
                  color: "#f59e0b"
                - min: 40
                  color: "#f97316"
                - min: 0
                  color: "#ef4444"
              zero_label: "Down"
            titleAction: "url:${action}"
            badge:
              show_if: "biggest_minus not contains 'No'"
              icon: "faExclamationCircle"
              tooltip: "${biggest_minus}"
    - name: "Beszel System Warnings"
      key: "beszel-system-warnings"
      template: "vertical-list"
      depends_on:
        - "computed.systems"
      # Hide the widget entirely when there are no warnings
      hide_if_empty: true
      data:
        source: "computed.systems"
        input:
          URL: "${URL}"
          TOKEN: "${TOKEN}"
          PB_USER: "${PB_USER}"
          PB_PASS: "${PB_PASS}"
          THRESHOLD_CPU_WARN: "${THRESHOLD_CPU_WARN}"
          THRESHOLD_CPU_CRITICAL: "${THRESHOLD_CPU_CRITICAL}"
          THRESHOLD_MEM_WARN: "${THRESHOLD_MEM_WARN}"
          THRESHOLD_MEM_CRITICAL: "${THRESHOLD_MEM_CRITICAL}"
          THRESHOLD_DISK_WARN: "${THRESHOLD_DISK_WARN}"
          THRESHOLD_DISK_CRITICAL: "${THRESHOLD_DISK_CRITICAL}"
      properties:
        header:
          title: "Beszel System Warnings"
          icon: "url:/icons/png/beszel-light.png"
          titleAction: "url:${URL}"
        list:
          iterate_over: "computed.systems"
          # Critical entries sort to the top
          sort_by: "severity"
          sort_order: "desc"
          prototype:
            # Left colour bar — red for critical, amber for warning
            accent:
              value: "severity"
              map:
                critical: "#ef4444"
                warning: "#f59e0b"
            icon:
              value: "severity"
              map:
                critical: "faExclamationCircle"
                warning: "faExclamation"
            title: "${system.name} ??? alpha"
            titleAction: "url:${action}"
            # Renders each warning string as its own line under the title
            subtitle:
              value: "${active_warnings} ??? CPU usage high"
              type: "list"
  search_items:
    - root:
        iterate_over: "this.endpoints.fetch-systems.mappedResponse.systems"
        mappingProperties:
          id: "${id}"
          name: "${name}"
          icon: "url:/icons/png/beszel-light.png"
          secondaryInfo: "System"
          type: "beszelItem"
          action: "url:${URL}/system/${id}"
          tags:
            - "Beszel"
            - "Systems"
            - "Monitoring"
            - "${name}"