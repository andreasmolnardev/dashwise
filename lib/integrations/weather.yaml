# Dashwise Integration YAML
details:
  name: Weather
  description: "Current weather and forecast via Open-Meteo"
  author: ""
  version: 1.0.0
  repository: ""
  icon: "/weather-icons/sun-clear.svg"
  links:
    website: "https://open-meteo.com"
    documentation: "https://open-meteo.com/en/docs"
    support: ""
  categories:
    - Weather

configuration:
  environment_variables:
    LAT:
      required: true
      description: "Latitude of the location to show weather for (e.g. 51.5074)"
    LON:
      required: true
      description: "Longitude of the location to show weather for (e.g. -0.1278)"
    DISPLAY_NAME:
      required: false
      description: "Human-readable location name shown in the widget header"
    UNIT:
      required: false
      default: "c"
      description: "Temperature unit — 'c' for Celsius, 'f' for Fahrenheit"
    SHOW_LOCATION:
      required: false
      default: true
      description: "Whether to show the location name above the forecast columns"

  endpoints:
    fetch-weather:
      method: GET
      # Open-Meteo requires no auth — public API
      url: >
        https://api.open-meteo.com/v1/forecast
        ?latitude=${LAT}
        &longitude=${LON}
        &current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,precipitation
        &hourly=temperature_2m,precipitation,precipitation_probability,weather_code
        &daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset
        &forecast_days=3
        &timezone=auto
        &temperature_unit=${if(UNIT == 'f', 'fahrenheit', 'celsius')}
        &wind_speed_unit=${if(UNIT == 'f', 'mph', 'kmh')}
      # Cache for 10 minutes — matches next: { revalidate: 600 }
      cache_ttl: 600
      response:
        type: json
      response_mapping:
        current:
          temperature: "current.temperature_2m"
          weather_code: "current.weather_code"
          wind_speed: "current.wind_speed_10m"
          wind_direction: "current.wind_direction_10m"
          humidity: "current.relative_humidity_2m"
          precipitation: "current.precipitation"
        daily:
          sunrise_today: "daily.sunrise[0]"
          sunset_today: "daily.sunset[0]"
          tonight:
            weather_code: "daily.weather_code[0]"
            temperature: "daily.temperature_2m_min[0]"
            precipitation: "daily.precipitation_sum[0]"
            precipitation_probability: "daily.precipitation_probability_max[0]"
          tomorrow:
            weather_code: "daily.weather_code[1]"
            temperature: "daily.temperature_2m_max[1]"
            precipitation: "daily.precipitation_sum[1]"
            precipitation_probability: "daily.precipitation_probability_max[1]"
          rain_chance_today: "daily.precipitation_probability_max[0]"
        hourly:
          iterate: "hourly.time"
          slice: "0:12"
          mappingProperties:
            time: "hourly.time[${_index}]"
            temperature: "hourly.temperature_2m[${_index}]"
            precipitation: "hourly.precipitation[${_index}]"
            precipitation_probability: "hourly.precipitation_probability[${_index}]"
            weather_code: "hourly.weather_code[${_index}]"

  # Weather code → icon file + description lookup table.
  # Declared here so both widgets and computed fields share the same source of truth.
  lookup_tables:
    weather_code_map:
      0:  { file: "sun-clear.svg",         desc: "Clear sky" }
      1:  { file: "sun-clear.svg",         desc: "Mainly clear" }
      2:  { file: "cloudy-sun.svg",        desc: "Partly cloudy" }
      3:  { file: "clouds-overcast.svg",   desc: "Overcast" }
      45: { file: "cloud-fog.svg",         desc: "Fog" }
      48: { file: "cloud-fog.svg",         desc: "Rime fog" }
      51: { file: "cloud-drizzle.svg",     desc: "Light drizzle" }
      53: { file: "cloud-drizzle.svg",     desc: "Moderate drizzle" }
      55: { file: "cloud-rain-heavy.svg",  desc: "Dense drizzle" }
      56: { file: "glass-sleet-96.png",    desc: "Freezing drizzle" }
      57: { file: "cloud-sleet.svg",       desc: "Freezing drizzle (heavy)" }
      61: { file: "cloud-rain.svg",        desc: "Slight rain" }
      63: { file: "cloud-rain.svg",        desc: "Moderate rain" }
      65: { file: "glass-rain-cloud-96.png", desc: "Heavy rain" }
      66: { file: "cloud-sleet.svg",       desc: "Freezing rain" }
      67: { file: "cloud-sleet.svg",       desc: "Freezing rain (heavy)" }
      71: { file: "cloud-snow.svg",        desc: "Slight snow" }
      73: { file: "cloud-snow.svg",        desc: "Moderate snow" }
      75: { file: "cloud-snow.svg",        desc: "Heavy snow" }
      80: { file: "cloud-rain.svg",        desc: "Slight showers" }
      81: { file: "cloud-rain.svg",        desc: "Moderate showers" }
      82: { file: "cloud-rain-heavy.svg",  desc: "Violent showers" }
      95: { file: "thunderstorm.svg",      desc: "Thunderstorm" }
      96: { file: "thunderstorm.svg",      desc: "Thunderstorm with slight hail" }
      99: { file: "thunderstorm.svg",      desc: "Thunderstorm with heavy hail" }

  computed:
    weather:
      fields:
        display_name: "${DISPLAY_NAME}"
        show_location: "${SHOW_LOCATION}"
        unit: "${if(UNIT == 'f', '°F', '°C')}"
        temperature: "this.endpoints.fetch-weather.mappedResponse.current.temperature"
        weather_code: "this.endpoints.fetch-weather.mappedResponse.current.weather_code"
        description:
          operation: lookup
          table: "weather_code_map"
          key: "this.endpoints.fetch-weather.mappedResponse.current.weather_code"
          field: "desc"
          fallback: "Unknown"
        icon_file:
          operation: weather_icon
          weather_code: "this.endpoints.fetch-weather.mappedResponse.current.weather_code"
          sunrise: "this.endpoints.fetch-weather.mappedResponse.daily.sunrise_today"
          sunset: "this.endpoints.fetch-weather.mappedResponse.daily.sunset_today"
          # Applies sun→moon and cloudy-sun→cloud substitutions when after sunset
          night_swap: true
        wind_speed: "this.endpoints.fetch-weather.mappedResponse.current.wind_speed"
        wind_direction: "this.endpoints.fetch-weather.mappedResponse.current.wind_direction"
        humidity: "this.endpoints.fetch-weather.mappedResponse.current.humidity"
        precipitation: "this.endpoints.fetch-weather.mappedResponse.current.precipitation"
        precipitation_probability: "this.endpoints.fetch-weather.mappedResponse.daily.rain_chance_today"
        sunrise: "this.endpoints.fetch-weather.mappedResponse.daily.sunrise_today"
        sunset: "this.endpoints.fetch-weather.mappedResponse.daily.sunset_today"
        rain_message:
          operation: expr
          expression: >
            if(rain_chance >= 60, 'Rain likely today',
              if(rain_chance >= 30, 'Possible rain later today',
                'No rain expected'))
          inputs:
            rain_chance: "this.endpoints.fetch-weather.mappedResponse.daily.rain_chance_today"
        # Insight string used by the overview widget
        insight:
          operation: expr
          expression: >
            if(rain_message != 'No rain expected', rain_message,
              if(desc contains 'rain', 'Rain likely later — keep an umbrella handy.',
                if(desc contains 'sun' or desc contains 'clear', 'Sunny day ahead',
                  if(desc contains 'cloud', 'Cloudy but stable weather.',
                    if(desc contains 'snow', 'Cold with possible snowfall.',
                      if(tomorrow_temp > today_temp, 'Warming trend tomorrow.',
                        if(tomorrow_temp < today_temp, 'Cooler weather on the way.',
                          'Mild and stable weather ahead.']))))))
          inputs:
            rain_message: "computed.weather.rain_message"
            desc: "computed.weather.description"
            today_temp: "this.endpoints.fetch-weather.mappedResponse.current.temperature"
            tomorrow_temp: "this.endpoints.fetch-weather.mappedResponse.daily.tomorrow.temperature"
        tonight:
          temperature: "this.endpoints.fetch-weather.mappedResponse.daily.tonight.temperature"
          precipitation: "this.endpoints.fetch-weather.mappedResponse.daily.tonight.precipitation"
          precipitation_probability: "this.endpoints.fetch-weather.mappedResponse.daily.tonight.precipitation_probability"
          weather_code: "this.endpoints.fetch-weather.mappedResponse.daily.tonight.weather_code"
          description:
            operation: lookup
            table: "weather_code_map"
            key: "this.endpoints.fetch-weather.mappedResponse.daily.tonight.weather_code"
            field: "desc"
            fallback: "Unknown"
          icon_file:
            operation: weather_icon
            weather_code: "this.endpoints.fetch-weather.mappedResponse.daily.tonight.weather_code"
            # Tonight column always uses the night icon variant
            night_swap: true
            force_night: true
        tomorrow:
          temperature: "this.endpoints.fetch-weather.mappedResponse.daily.tomorrow.temperature"
          precipitation: "this.endpoints.fetch-weather.mappedResponse.daily.tomorrow.precipitation"
          precipitation_probability: "this.endpoints.fetch-weather.mappedResponse.daily.tomorrow.precipitation_probability"
          weather_code: "this.endpoints.fetch-weather.mappedResponse.daily.tomorrow.weather_code"
          description:
            operation: lookup
            table: "weather_code_map"
            key: "this.endpoints.fetch-weather.mappedResponse.daily.tomorrow.weather_code"
            field: "desc"
            fallback: "Unknown"
          icon_file:
            operation: weather_icon
            weather_code: "this.endpoints.fetch-weather.mappedResponse.daily.tomorrow.weather_code"
            sunrise: "this.endpoints.fetch-weather.mappedResponse.daily.sunrise_today"
            sunset: "this.endpoints.fetch-weather.mappedResponse.daily.sunset_today"
            night_swap: true
        hourly: "this.endpoints.fetch-weather.mappedResponse.hourly"
      useEnv:

  widgets:
    # --- Compact 3-column forecast (Now / Tonight / Tomorrow) ---
    - name: "Weather Otherview"
      template: "columns"
      depends_on:
        - "computed.weather"
      data:
        source: "computed.weather"
        input:
          lat: "${LAT}"
          lon: "${LON}"
          unit: "${UNIT}"
          displayName: "${DISPLAY_NAME}"
          showLocation: "${SHOW_LOCATION}"
      properties:
        header:
          show_if: "${SHOW_LOCATION}"
          title: "${computed.weather.display_name} ??? Seattle"
          icon: "/weather-icons/${computed.weather.icon_file} ??? /weather-icons/sun-clear.svg"
        columns:
          - label: "Now"
            icon:
              type: "weather"
              file: "${computed.weather.icon_file} ??? sun-clear.svg"
              size: 32
              description: "${computed.weather.description} ??? Clear sky"
            primary: "${computed.weather.temperature}${computed.weather.unit} — ${computed.weather.precipitation_probability}% ??? 18°C — 20%"

          - label: "Tonight"
            icon:
              type: "weather"
              file: "${computed.weather.tonight.icon_file} ??? moon-stars-night.svg"
              size: 32
              description: "${computed.weather.tonight.description} ??? Clear night"
            primary: "${computed.weather.tonight.temperature}${computed.weather.unit} — ${computed.weather.tonight.precipitation_probability}% ??? 11°C — 60%"

          - label: "Tomorrow"
            icon:
              type: "weather"
              file: "${computed.weather.tomorrow.icon_file} ??? sun-clear.svg"
              size: 32
              description: "${computed.weather.tomorrow.description} ??? Sunny"
            primary: "${computed.weather.tomorrow.temperature}${computed.weather.unit} — ${computed.weather.tomorrow.precipitation_probability}% ??? 21°C — 30%"

    # --- Overview: large icon + current temp + insight string ---
    - name: "Current Weather Conditions"
      template: "icon-details-card"
      depends_on:
        - "computed.weather"
      data:
        source: "computed.weather"
        input:
          lat: "${LAT}"
          lon: "${LON}"
          unit: "${UNIT}"
          displayName: "${DISPLAY_NAME}"
          showLocation: "${SHOW_LOCATION}"
      properties:
        icon:
          type: "weather"
          file: "${computed.weather.icon_file} ??? sun-clear.svg"
          size: 48
          description: "${computed.weather.description} ??? Clear sky"
        primary: "${computed.weather.temperature}${computed.weather.unit} ${computed.weather.description} ??? 18°C Clear sky"
        secondary: "${computed.weather.insight} ??? Sunny day ahead"

  glanceables:
    - name: "Local Weather"
      properties:
        lat: "${LAT}"
        lon: "${LON}"
        unit: "${UNIT}"
        displayName: "${DISPLAY_NAME}"
        showLocation: "${SHOW_LOCATION}"
      icon:
        file: "${computed.weather.icon_file} ??? sun-clear.svg"
        size: 16
        description: "${computed.weather.description} ??? Clear sky"
      text: "${computed.weather.temperature}${computed.weather.unit} ??? 18°C"

  # Weather has no meaningful search items — the section is omitted intentionally.