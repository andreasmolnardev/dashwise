services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: dashwise:dev
    container_name: dashwise-app-live
    working_dir: /app
    command: sh -lc "bun install --frozen-lockfile && bun run dev"
    ports:
      - "3000:3000"
      - "5173:5173"
    env_file:
      - path: .env.dev
        required: false
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DATA_DIR: /data
      DATABASE_PATH: /data/dashwise.sqlite
      WEB_DIST: /app/apps/web/dist
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - web-node-modules:/app/apps/web/node_modules
      - integrationskit-node-modules:/app/packages/integrationskit/node_modules
      - ./dashwise-data:/data
    networks:
      - dashwise-default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  dashwise-default:

volumes:
  app-node-modules:
  web-node-modules:
  integrationskit-node-modules:
