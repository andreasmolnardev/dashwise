services:
  dashwise:
    build:
      context: .
      dockerfile: Dockerfile
    image: dashwise:go-migration-test
    ports:
      - "3016:3000"
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DASHWISE_URL: http://localhost:3016
      DATA_DIR: /data
      DATABASE_PATH: /data/dashwise.sqlite
      WEB_DIST: /app/public
    volumes:
      - ./dashwise-test-data:/data
